name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import assets
        run: godot --headless --path . --import || true
      - name: Run tests
        run: godot --headless --path . res://tests/test_runner.tscn
